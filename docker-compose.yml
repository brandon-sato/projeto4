services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: lotusspa3
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rede-interna

  backend:
    build:
      context: ./lotusBackEnd
    restart: unless-stopped
    environment:
      SERVER_PORT: 3001
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: lotusspa3
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ""
      JWT_SECRET: Ac-cTnOXyfHecAIVa-sHy5cAoqys6veJdxuOyYEIUzs

    expose:
      - "3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rede-interna

  frontend:
    build:
      context: ./lotusFrontEnd
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - rede-interna

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rede-interna
      - rede-externa


volumes:
  mysql_data:

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge
    internal: true
